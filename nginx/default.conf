server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El estado completo del prototipo puede crecer con evaluaciones y planes.
    client_max_body_size 10m;

    # Proxy del plan de mejora con IA: la API key vive en el proceso Node,
    # nunca en el navegador ni en archivos estáticos.
    location ^~ /api/gemini {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API de sincronización con MariaDB (estado, salud y resumen).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos del servidor y la configuración nunca se sirven como estáticos.
    # /api/ se excluye porque lo maneja el proxy de arriba.
    location ~ ^/(server|functions|docker|nginx|db)/ {
        return 404;
    }
}
